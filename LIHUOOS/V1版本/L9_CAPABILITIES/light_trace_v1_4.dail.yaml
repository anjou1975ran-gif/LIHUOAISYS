  version: LIGHT_TRACE_V1.4_L9_BINDING_V1.0
  inherits: LIHUO_FUNCTIONAL_MODULE_CONTRACT_V0_3
  source_lineage:
    historical_module: GENERIC_LIGHTER_V3.0.3_EXP_LIGHT_TRACE_V1.4
    historical_full_source:
