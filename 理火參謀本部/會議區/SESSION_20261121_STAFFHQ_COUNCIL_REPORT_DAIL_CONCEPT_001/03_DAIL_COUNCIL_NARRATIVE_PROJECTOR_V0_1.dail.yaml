DAIL_TASK_DECLARATION:
  entity:
    - HUMAN_READER
    - COUNCIL_SESSION
    - HUMAN_MANDATE
    - CLAIM
    - OBJECTION
    - RESPONSE
    - OWNER_STANCE
    - MATERIAL_DELTA
    - QUALIFIED_EVIDENCE
    - UNKNOWN
    - GOVERNANCE_GATE
  state:
    canonical_source: CP0_EXACT_SOURCE_AND_CP1_TYPED_HISTORY
    qualified_current_view: CP2_REDUCED_STATE
    presentation_layer: CP3_DERIVED_ONLY
    phase: OPEN_OR_CHECKPOINT_OR_TERMINAL_AS_ACTUALLY_RECORDED
  goal:
    primary: HUMAN_UNDERSTANDING_OF_WHY_COUNCIL_REACHED_CURRENT_POSITION
    reader_answers:
      - WHAT_WAS_ASKED
      - WHAT_PATHS_WERE_PROPOSED
      - WHO_CHALLENGED_WHICH_CLAIM_AND_WHY
      - WHICH_RESPONSES_CHANGED_THE_OWNED_JUDGMENT
      - WHICH_RISKS_UNKNOWNS_AND_MINORITIES_SURVIVE
      - WHAT_REQUIRES_HUMAN_ACTION_NOW_IF_ANY
  relation:
    admissible_edges:
      - CHALLENGES
      - RESPONDS_TO
      - TRIGGERED_BY
      - SUPERSEDES
      - WITHDRAWS
      - RESTORES
      - EXPLICIT_MATERIAL_BASIS
    temporal_only_is_not_causality: true
    owner_and_version_lineage_required: true
    preserve_dissent_and_unknown: true
  constraint:
    - DO_NOT_CREATE_NEW_CANONICAL_EVENTS_FROM_RENDERER
    - DO_NOT_REWRITE_ORIGIN_SEMANTIC_TYPE
    - DO_NOT_MINT_STANCE_AUTHORITY_TRUTH_OR_RELEASE
    - DO_NOT_ASSUME_CROSS_SEAT_CONSENT
    - DO_NOT_INFER_CONSUMPTION_FROM_DELIVERY
    - DO_NOT_INFER_CONSENSUS_FROM_QUIET
    - DO_NOT_TREAT_SUMMARY_AS_SOURCE
    - NO_HIDDEN_COT_OR_PRIVATE_STATE
    - NO_FABRICATED_L8_TRACE_OR_EXPERT_RETURN
    - NO_UNSUPPORTED_CAUSAL_CLAIM_FROM_CHRONOLOGY
    - NO_HUMAN_DECISION_WITHOUT_HUMAN_EVENT
    - RESPECT_READER_AUTHORIZATION_AND_SOURCE_DISCLOSURE_SCOPE
    - REPORT_EVIDENCE_GAP_IF_REFERENCED_SOURCE_UNAVAILABLE
  principle:
    - RELATION_FIRST
    - FAITHFUL_PROVENANCE
    - HUMAN_READABILITY_WITHOUT_FALSE_CERTAINTY
    - MINORITY_SURVIVES_SUMMARIZATION
    - REPORT_IS_REENTRY_VIEW_NOT_JUDICIAL_VERDICT
  output_contract:
    modes:
      - EXECUTIVE_BRIEF
      - NARRATIVE_FULL_REPORT
      - AUDIT_EXPLAIN
      - SOURCE_GROUNDED_FOLLOWUP_QA
    required_semantics:
      - ORIGINAL_QUESTION_AND_SCOPE
      - MAJOR_PATH_AND_DISPUTE_TRAJECTORY
      - MATERIAL_TURNING_POINTS_WITH_LINEAGE
      - CURRENT_QUALIFIED_POSITION
      - SURVIVING_MATERIAL_OBJECTIONS_AND_UNKNOWN
      - HUMAN_NEXT_ACTION_OR_NO_IMMEDIATE_ACTION
      - PROVENANCE_MAP
    source_annotation:
      claim_status:
        - SOURCE_QUALIFIED
        - OWNER_DECLARED
        - TEMPORAL_ONLY
        - RENDERER_INFERENCE_FOR_REVIEW
        - UNKNOWN
      no_unlabelled_material_inference: true
  validation:
    - READER_CAN_RESTATE_PROBLEM_AND_KEY_DISPUTE
    - EACH_MATERIAL_TURNING_POINT_HAS_OWNER_BASIS_AND_SOURCE_REF
    - UNRESOLVED_MINORITIES_REMAIN_VISIBLE
    - EVENT_GRAPH_REPLAY_DISAGREES_WITH_RENDERER_IMPLIES_REPORT_FAILURE
    - LACK_OF_SOURCE_IMPLIES_EXPLICIT_EVIDENCE_GAP
    - FINAL_REPORT_NEVER_CREATES_AUTHORITY
  reversibility:
    report_can_be_regenerated_from_same_canonical_state: true
    correction_policy: NEW_VERSION_OF_DERIVED_VIEW_WITH_SOURCE_REF
    canonical_history_immutable_by_report: true

