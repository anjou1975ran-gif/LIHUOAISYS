  purpose:
    - PROJECT_QUALIFIED_COUNCIL_RELATIONS_INTO_HUMAN_READABLE_NARRATIVE
    - EXPLAIN_MATERIAL_OBJECTIONS_RESPONSES_AND_POSITION_CHANGES
    - ENABLE_SOURCE_ANCHORED_READING_WITHOUT_SECOND_CANONICAL_HISTORY
  source_lineage:
    - LIHUOOS_V1_4_2_L9_DAIL_CAPABILITY_REPOSITORY
    - STAFF_HQ_MEETING_RECORD_AND_CHAT_SURFACE_V0_1
    - STAFF_HQ_CP3_PROJECTION_ARCHITECTURE_CANDIDATE_V0_2
